    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    /* Static fallback: painted immediately, and all that is left if the
       module never runs (no WebGL, no JS, CDN unreachable). */
    body {
      background:
        radial-gradient(46% 34% at 64% 50%, rgba(255, 176, 96, 0.13), transparent 66%),
        radial-gradient(120% 96% at 16% 10%, rgba(150, 96, 58, 0.14), transparent 62%),
        radial-gradient(92% 74% at 82% 90%, rgba(74, 92, 156, 0.09), transparent 68%),
        #04040a;
    }

    #sky {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    #sky.ready { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      #sky { transition: none; }
    }

      [0.818900685, 0.994212745, 1.590592233, 3.811750544],
      [0.809449923, 0.993883377, 1.621683593, 3.924097477],
      [0.800636939, 0.993500202, 1.651429947, 4.032853411],
      [0.792415781, 0.993074170, 1.679858149, 4.138227244],
      [0.784743692, 0.992614829, 1.706999524, 4.240415898],
      [0.777580950, 0.992130454, 1.732889045, 4.339604874],
      [0.770890698, 0.991628182, 1.757564571, 4.435968804],
      [0.764638772, 0.991114123, 1.781066155, 4.529671998],
      [0.758793541, 0.990593478, 1.803435423, 4.620868985],
      [0.753325736, 0.990070643, 1.824715028, 4.709705037],
      [0.748208291, 0.989549300, 1.844948167, 4.796316682],
    ].map(sample => new THREE.Vector4(...sample));

    const fwd   = CAM.clone().negate().normalize();
    const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), fwd).normalize();
    const up    = new THREE.Vector3().crossVectors(fwd, right).normalize();

    const uniforms = {
      uRes:    { value: new THREE.Vector2(1, 1) },
      uTime:   { value: 0 },
      uCamPos: { value: CAM },
      uRight:  { value: right },
      uUp:     { value: up },
      uFwd:    { value: fwd },
      uFocal:  { value: FOCAL },
      uCenter: { value: new THREE.Vector2(0, 0) },
      uBlackbody: { value: blackbodyColors },
      uHit0: { value: null },
      uHit1: { value: null },
      uBackdrop: { value: null },
      uOpacity1: { value: null }
    };

    const vert = `
      void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }
    `;

    // One photographic response for the HDR output and non-HDR fallback.
    // Grade after coverage averaging and tone mapping, before sRGB encoding;
    // the disk's temperature, spectrum and relativistic transfer stay upstream.
    const filmGrade = `
      vec3 filmGrade(vec3 mapped, vec3 averagedHDR, float exposure) {
        const vec3 Y = vec3(0.2126, 0.7152, 0.0722);
        vec3 color = clamp(mapped, 0.0, 1.0);
        vec3 hdr = max(averagedHDR, 0.0);
        float y = dot(color, Y);
        float yh = dot(hdr, Y);
        if (y <= 0.0 || yh <= 0.0) return vec3(0.0);
        float x = yh * exposure;
        float warm = smoothstep(-0.08, 0.22, (hdr.r - hdr.b) /
                               (hdr.r + hdr.g + hdr.b + 1e-6));
        float shadows = 1.0 - smoothstep(0.04, 0.20, x);
        float highlights = smoothstep(0.70, 2.40, x);
        float midtones = max(1.0 - shadows - highlights, 0.0);
        // Copper shadows, amber midtones, ivory highlights. Weights follow
        // observed radiance, so all lensed images share the same response.
        vec3 shadowColor = vec3(1.0, 0.24, 0.018);
        vec3 midColor = vec3(1.0, 0.55, 0.14);
        vec3 highColor = vec3(1.0, 0.985, 0.945);
        shadowColor /= dot(shadowColor, Y);
        midColor /= dot(midColor, Y);
        highColor /= dot(highColor, Y);
        vec3 palette = shadows * shadowColor + midtones * midColor + highlights * highColor;
        palette /= dot(palette, Y);
        float strength = smoothstep(0.002, 0.02, x) * 0.48 *
                         mix(warm, 0.48, highlights);
        vec3 unitColor = mix(color / y, palette, strength);
        float saturation = 1.0 + 0.08 * midtones * warm;
        unitColor = max(vec3(1.0) + saturation * (unitColor - vec3(1.0)), 0.0);
        unitColor /= dot(unitColor, Y);
        // Lift low midtones and retain a gold transition below the white peaks.
        // This curve is monotone on [0,1], with G(0)=0,
        // G(1)=1; it never raises a zero-radiance background into gray haze.
        float toeMask = smoothstep(0.002, 0.03, y);
        float shoulder = 1.0 - y;
        float outputY = y + 1.45 * y * shoulder * shoulder * shoulder * shoulder * toeMask;
        outputY -= 0.25 * y * y * shoulder * smoothstep(0.45, 0.85, y);
        vec3 candidate = outputY * unitColor;
        // Compress out-of-gamut colors toward neutral at the chosen luminance.
        float maximum = max(candidate.r, max(candidate.g, candidate.b));
        float keep = min(1.0, (1.0 - outputY) / max(maximum - outputY, 1e-8));
        return vec3(outputY) + keep * (candidate - vec3(outputY));
      }
    `;

    const frag = `
      precision highp float;

      uniform vec2  uRes;
      uniform float uTime;
      uniform vec3  uCamPos;
      uniform vec3  uRight;
      uniform vec3  uUp;
      uniform vec3  uFwd;
      uniform float uFocal;
      uniform vec2  uCenter;
      uniform vec4  uBlackbody[64];

      #ifdef CACHE_RAYS
        layout(location = 1) out vec4 cachedHit1;
        layout(location = 2) out vec4 cachedBackdrop;
        layout(location = 3) out vec4 cachedOpacity1;
      #endif
      // Collect geometry before shading so pixel derivatives never run inside
      // the divergent geodesic loop. Cached and full paths shade the same records.
      vec4 hitRecord0 = vec4(0.0);
      vec4 hitRecord1 = vec4(0.0);
      vec2 hitOpacity = vec2(0.0);
      int hitCount = 0;
      #ifdef SHADE_CACHED_RAYS
        uniform highp sampler2D uHit0;
        uniform highp sampler2D uHit1;
        uniform highp sampler2D uBackdrop;
        uniform highp sampler2D uOpacity1;
      #endif

      const float RS    = 1.0;    // event horizon
      const float R_IN  = 3.00;   // inner edge of the disk: the ISCO, 6M
      const float R_OUT = 10.0;   // outer edge
      const float R_ESC = 28.0;   // finish sky deflection with bounded tail quadrature
      // One animation second = 1.2 Schwarzschild coordinate-time units (Rs/c).
      // This sets playback speed, not Kerr spin or a measured black-hole mass.
      const float SIM_RATE = 1.2;

      float hash13(vec3 p) {
        p = fract(p * 0.1031);
        p += dot(p, p.zyx + 31.32);
        return fract((p.x + p.y) * p.z);
      }

      float vnoise(vec3 p) {
        vec3 i = floor(p);
        vec3 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash13(i + vec3(0.0, 0.0, 0.0));
        float b = hash13(i + vec3(1.0, 0.0, 0.0));
        float c = hash13(i + vec3(0.0, 1.0, 0.0));
        float d = hash13(i + vec3(1.0, 1.0, 0.0));
        float e = hash13(i + vec3(0.0, 0.0, 1.0));
        float g = hash13(i + vec3(1.0, 0.0, 1.0));
        float h = hash13(i + vec3(0.0, 1.0, 1.0));
        float k = hash13(i + vec3(1.0, 1.0, 1.0));
        return mix(mix(mix(a, b, f.x), mix(c, d, f.x), f.y),
                   mix(mix(e, g, f.x), mix(h, k, f.x), f.y), f.z);
      }

      // Octave count is a parameter because the disk needs a band limit the
      // background does not: its texture is compressed hard by the lensing, so
      // a fourth octave there lands near the pixel pitch and crawls.
      float fbm(vec3 p, int oct) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 4; i++) {
          if (i >= oct) break;
          v += a * vnoise(p);
          p = p * 2.03 + 13.7;
          a *= 0.5;
        }
        return v;
      }

      // Null geodesic in Schwarzschild, Cartesian form. The force is central,
      // so h^2 = |r x v|^2 is conserved and is taken once from the initial ray.
      //   d2r/dl2 = -1.5 * h^2 * r / |r|^5      (equivalent to u'' + u = 3Mu^2)
      vec3 accel(vec3 p, float h2) {
        float r2 = dot(p, p);
        return -1.5 * h2 * p / (r2 * r2 * sqrt(r2));
      }

      // E=1 affine parameter. Advance position, velocity and coordinate time with
      // the same RK4 stages. The clamp only protects the final horizon-crossing
      // step; disk hits are outside 3 Rs, where all time samples are regular.
      float timeRate(vec3 p) {
        return 1.0 / max(1.0 - RS / length(p), 1e-4);
      }

      void rayStep(vec3 p, vec3 v, float h2, float h,
                   out vec3 nextP, out vec3 nextV, out float dt) {
        vec3 a1 = accel(p, h2);
        vec3 p2 = p + v * (0.5 * h);
        vec3 v2 = v + a1 * (0.5 * h);
        vec3 a2 = accel(p2, h2);
        vec3 p3 = p + v2 * (0.5 * h);
        vec3 v3 = v + a2 * (0.5 * h);
        vec3 a3 = accel(p3, h2);
        vec3 p4 = p + v3 * h;
        vec3 v4 = v + a3 * h;
        nextP = p + (v + 2.0 * v2 + 2.0 * v3 + v4) * (h / 6.0);
        nextV = v + (a1 + 2.0 * a2 + 2.0 * a3 + accel(p4, h2)) * (h / 6.0);
        dt = (timeRate(p) + 2.0 * timeRate(p2) + 2.0 * timeRate(p3) + timeRate(p4)) * (h / 6.0);
      }

      vec3 escapeDirection(vec3 p, vec3 angularMomentum) {
        float r = length(p);
        float b = length(angularMomentum);
        vec3 radial = p / r;
        if (b < 1e-7) return radial;
        float q = b / r;
        float w = RS * q * q / r;
        // Five-point Gauss-Legendre quadrature of the remaining angular orbit,
        // from R_ESC to infinity. Sampling the finite-radius tangent misses it.
        float angle = 0.0;
        const float nodes[5] = float[5](0.046910077, 0.230765345, 0.5, 0.769234655, 0.953089923);
        const float weights[5] = float[5](0.118463443, 0.239314335, 0.284444444, 0.239314335, 0.118463443);
        for (int i = 0; i < 5; i++) {
          float x = nodes[i];
          angle += weights[i] * inversesqrt(1.0 - q * q * x * x + w * x * x * x);
        }
        angle *= q;
        vec3 tangent = normalize(cross(angularMomentum, radial));
        return cos(angle) * radial + sin(angle) * tangent;
      }

      // Filter radiance over the lensed pixel footprint. Its angular area already
      // accounts for resolved lens magnification; do not multiply radiance by it.
      vec3 starLayer(vec3 d, vec3 ddx, vec3 ddy, float scale, float threshold) {
        const float PI = 3.14159265359;
        const float BASE_VAR = 0.0064;
        vec2 grid = floor(vec2(2.0 * PI, PI) * scale + 0.5);
        vec3 meanLight = vec3(0.88, 0.855, 0.86) *
            ((1.0 - threshold) * 2.0 * PI * BASE_VAR * (0.12 + 2.8 / 9.0));
        float horizontal2 = dot(d.xz, d.xz);
        if (horizontal2 <= 1e-6) return meanLight;
        float polarBlend = 1.0 - smoothstep(1e-6, 1e-4, horizontal2);
        vec2 uv = vec2(atan(d.z, d.x) / (2.0 * PI) + 0.5,
                       asin(clamp(d.y, -1.0, 1.0)) / PI + 0.5) * grid;

        // Differentiate the direction before its angular chart: atan has a seam.
        vec2 dx = vec2((d.x * ddx.z - d.z * ddx.x) / horizontal2,
                       ddx.y / sqrt(horizontal2)) * grid / vec2(2.0 * PI, PI);
        vec2 dy = vec2((d.x * ddy.z - d.z * ddy.x) / horizontal2,
                       ddy.y / sqrt(horizontal2)) * grid / vec2(2.0 * PI, PI);
        float jxx = dx.x * dx.x + dy.x * dy.x;
        float jyy = dx.y * dx.y + dy.y * dy.y;
        float jxy = dx.x * dx.y + dy.x * dy.y;
        float largest = 0.5 * (jxx + jyy +
            sqrt((jxx - jyy) * (jxx - jyy) + 4.0 * jxy * jxy));
        // A bounded 3x3 filter cannot resolve very large footprints. Fade to the
        // population mean instead of truncating their energy or producing flashes.
        float meanBlend = max(polarBlend, smoothstep(0.9, 1.5, sqrt(largest)));
        if (meanBlend >= 1.0) return meanLight;
        float cxx = BASE_VAR + jxx / 12.0;
        float cyy = BASE_VAR + jyy / 12.0;
        float cxy = jxy / 12.0;
        float determinant = max(cxx * cyy - cxy * cxy, BASE_VAR * BASE_VAR);
        float normalization = BASE_VAR / sqrt(determinant);
        vec2 cell = floor(uv);
        vec3 light = vec3(0.0);
        for (int y = -1; y <= 1; y++) {
          for (int x = -1; x <= 1; x++) {
            vec2 sourceCell = cell + vec2(float(x), float(y));
            if (sourceCell.y < 0.0 || sourceCell.y >= grid.y) continue;
            vec2 id = vec2(mod(sourceCell.x, grid.x), sourceCell.y);
            if (hash13(vec3(id, scale)) < threshold) continue;
            vec2 seed = vec2(hash13(vec3(id, 2.7)), hash13(vec3(id, 9.1)));
            vec2 delta = uv - sourceCell - mix(vec2(0.2), vec2(0.8), seed);
            float q = (cyy * delta.x * delta.x - 2.0 * cxy * delta.x * delta.y +
                       cxx * delta.y * delta.y) / determinant;
            float energy = exp(-0.5 * max(q, 0.0)) * normalization;
            float magnitude = 0.12 + 2.8 * pow(hash13(vec3(id, 19.3)), 8.0);
            vec3 tint = mix(vec3(0.76, 0.84, 1.0), vec3(1.0, 0.87, 0.72), seed.x);
            light += tint * energy * magnitude;
          }
        }
        return mix(light, meanLight, meanBlend);
      }

      vec3 sky(vec3 d, vec3 ddx, vec3 ddy) {
        vec3 c = starLayer(d, ddx, ddy, 160.0, 0.994);
        c += starLayer(d, ddx, ddy, 310.0, 0.997) * 0.4;
        // Very faint interstellar dust; all background light follows the ray.
        float dust = fbm(d * 3.0 + 11.3, 3);
        float band = exp(-18.0 * pow(d.y + d.x * 0.25, 2.0));
        c += vec3(0.11, 0.13, 0.18) * smoothstep(0.35, 0.8, dust) * band * 0.012;
        return c;
      }

      // Periodic polar noise stretches local patches along the orbit. Wrap
      // lattice corners, not the interpolated angle, to keep the seam smooth.
      float diskValueNoise(vec2 p, float seed, float angularPeriod) {
        vec2 cell = floor(p);
        vec2 f = fract(p);
        f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
        float y0 = mod(cell.y, angularPeriod);
        float y1 = mod(cell.y + 1.0, angularPeriod);
        return mix(mix(hash13(vec3(cell.x, y0, seed)),
                       hash13(vec3(cell.x + 1.0, y0, seed)), f.x),
                   mix(hash13(vec3(cell.x, y1, seed)),
                       hash13(vec3(cell.x + 1.0, y1, seed)), f.x), f.y);
      }

      float diskFlowField(float r, float phi, float age, float epoch,
                          vec2 footprint, float frequency, float angularPeriod,
                          float stream, int octaves) {
        const float TAU = 6.28318530718;
        float omega = sqrt(0.5) * SIM_RATE / (r * sqrt(r));
        float a = phi - omega * age;
        float seed = hash13(vec3(epoch, stream, 7.31));
        // Vary the spacing and tilt of emitting layers, with the same two-sine
        // budget. Integer angular harmonics preserve the periodic seam.
        float warp = 0.12 * sin(2.7 * r + seed * 17.3) +
                     0.10 * sin(3.0 * a + seed * TAU);
        vec2 q = vec2((r + warp) * frequency,
                      a * angularPeriod / TAU + 0.35 * r);
        q += fract(seed * vec2(173.31, 241.47)) * vec2(64.0, angularPeriod);
        // Include retarded time, orbital shear and conservative warp bounds:
        // radial slope <= 1+.12*2.7=1.324, angular slope <= .10*3=.30.
        // The angular chart's radial tilt also contributes .35*radialWidth.
        float angularWidth = footprint.y + 1.5 * omega * age * footprint.x / r;
        float width = length(vec2((1.324 * footprint.x + 0.30 * angularWidth) * frequency,
                                  angularWidth * angularPeriod / TAU + 0.35 * footprint.x));
        float n = 0.5;
        float amplitude = octaves == 1 ? 1.0 : 0.6666667;
        for (int i = 0; i < 2; i++) {
          if (i >= octaves) break;
          float resolved = 1.0 - smoothstep(0.35, 0.85, width);
          if (resolved > 0.0) {
            n += amplitude * resolved * (diskValueNoise(q, seed * 91.9 + stream,
                                                       angularPeriod) - 0.5);
          }
          // Integer doubling preserves the angular lattice's exact period.
          q = q * 2.0 + vec2(11.7, 7.3);
          angularPeriod *= 2.0;
          width *= 2.0;
          amplitude *= 0.5;
        }
        return n;
      }

      float diskFlow(float r, float phi, float emissionTime, vec2 footprint,
                     float lifetime, float frequency, float angularPeriod,
                     float stream, int octaves) {
        float cycle = emissionTime / lifetime;
        float epoch = floor(cycle);
        float phase = fract(cycle);
        float otherPhase = fract(phase + 0.5);
        float otherEpoch = epoch + step(0.5, phase);
        float blend = 0.5 - 0.5 * cos(phase * 6.2831853);
        // Each stream changes its epoch seed only when both its weight and its
        // weight derivative are zero. floor/fract also handle negative delays.
        float first = diskFlowField(r, phi, phase * lifetime, epoch,
            footprint, frequency, angularPeriod, stream, octaves);
        float second = diskFlowField(r, phi, otherPhase * lifetime, otherEpoch,
            footprint, frequency, angularPeriod, stream + 19.31, octaves);
        return mix(second, first, blend);
      }

      float diskDissipation(float r, float phi, float emissionTime, vec2 footprint) {
        // Noncommensurate lifetimes and new epoch seeds avoid a short global loop.
        // Two coarse octaves and one fine octave still cost six 4-corner samples.
        float coarse = diskFlow(r, phi, emissionTime, footprint, 31.0, 2.6, 24.0, 0.7, 2);
        float fine = diskFlow(r, phi, emissionTime, footprint, 43.8406204, 6.4, 48.0, 8.3, 1);
        float broad = coarse - 0.5;
        float fibre = fine - 0.5;
        // Sparse symmetric accents reveal short fibres between broader layers;
        // they fade in plateaus instead of covering the whole disk in grain.
        fibre *= smoothstep(0.06, 0.18, abs(fibre));
        fibre *= 1.0 - smoothstep(0.24, 0.44, abs(broad));
        float structure = 0.5 + 0.78 * broad + 0.22 * fibre;
        // Shallower troughs reduce black blotches through the thermal source,
        // not an extra colour/brightness multiplier. Unresolved heating is one.
        // Unit ensemble mean is an approximation, not a per-ring constraint.
        return mix(0.55, 1.45, smoothstep(0.23, 0.77, structure));
      }

      // Schwarzschild Page-Thorne zero-torque flux, normalized at 4.775464 Rs.
      // q=sqrt(r/M); the ISCO expansion avoids cancellation in the log formula.
      // Source: Page & Thorne 1974, https://doi.org/10.1086/152990
      float ntFlux(float r) {
        if (r <= R_IN) return 0.0;
        float q = sqrt(2.0 * r);
        float d = 2.0 * (r - R_IN) / (q + 2.449489743);
        float integral;
        if (d < 0.1) {
          integral = d*d*(0.816496581 + d*(-0.777777778 +
              d*(0.816496581 + d*(-0.911111111 +
              d*(1.058421494 + d*(-1.264550265 + d*1.542271320))))));
        } else {
          integral = d - 0.866025404 *
              log((q - 1.732050808) / (q + 1.732050808) * 5.828427125);
        }
        return max(8726.805104 * integral / (q*q*q*q*q*(q*q - 3.0)), 0.0);
      }

      vec3 blackbodyRadiance(float kelvin) {
        // Below 1000 K the visible Y is <5.21e-9 of the 4500 K reference.
        if (kelvin < 1000.0) return vec3(0.0);
        float sampleIndex = clamp(log(kelvin / 1000.0) / log(20.0), 0.0, 1.0) * 63.0;
        int i = min(int(floor(sampleIndex)), 62);
        vec4 sampleValue = mix(uBlackbody[i], uBlackbody[i + 1], sampleIndex - float(i));
        return sampleValue.rgb * exp(sampleValue.a);
      }

      // Shared by the full trace and cached path; keep arithmetic/time sampling
      // identical so both paths produce the same animated emission.
      vec3 diskEmission(float r, float phi, float travelTime, float shift, vec2 footprint) {
        float emissionTime = uTime - travelTime / SIM_RATE;
        float heating = diskDissipation(r, phi, emissionTime, footprint);
        float localFlux = ntFlux(r) * heating;
        // The fixed gray optical depth contributes a constant hemispheric factor
        // absorbed into this uncalibrated temperature scale. Heating changes T,
        // not an independent intensity multiplier: the source function is Bnu(T).
        float temperature = 5200.0 * pow(localFlux, 0.25);
        // g^3 Bnu(nu/g,T)=Bnu(nu,gT). The CIE-visible spectrum already includes
        // the frequency shift; do not multiply by another flux, heating or g^4.
        // Normalize the display gain to the LUT's Y at the 5200 K peak scale.
        return (0.85 / 2.167645742) * blackbodyRadiance(temperature * shift);
      }

      // A gray emitting slab of finite optical depth, not an opaque SS disk.
      // Emission and absorption are accumulated front to back at retarded times.
      vec4 diskSample(vec3 hit, vec3 vel, float travelTime) {
        float r = length(hit);
        float u = (r - R_IN) / (R_OUT - R_IN);
        if (u < 0.0 || u > 1.0) return vec4(0.0);

        float phi = atan(hit.z, hit.x);
        float edge = smoothstep(0.0, 0.035, u) * (1.0 - smoothstep(0.65, 1.0, u));

        float f = 1.0 - RS / r;
        vec3 radial = hit / r;
        // Auxiliary coordinate velocity -> the static observer's orthonormal frame.
        vec3 nv = normalize(vel + radial * dot(vel, radial) * (inversesqrt(f) - 1.0));
        vec3 vhat = normalize(cross(hit, vec3(0.0, 1.0, 0.0)));
        float beta = sqrt(1.0 / (2.0 * (r - RS)));
        float dop = sqrt(1.0 - beta * beta) / (1.0 - dot(vhat * beta, -nv));
        float shift = dop * sqrt(f / (1.0 - RS / length(uCamPos)));

        // Aberration into the gas frame (its boost is parallel to the disk).
        float muComoving = clamp(dop * abs(nv.y), 0.0, 1.0);
        float opacity = edge * (1.0 - exp(-1.8 / max(muComoving, 0.001)));
        // Continuous orbits cross r >= 3 Rs at most twice. Preserve numerical
        // exceptions in the full path; the cache flags them for frame fallback.
        if (hitCount == 0) {
          hitRecord0 = vec4(r, phi, travelTime, shift);
          hitOpacity.x = opacity;
        } else if (hitCount == 1) {
          hitRecord1 = vec4(r, phi, travelTime, shift);
          hitOpacity.y = opacity;
        } else {
          #ifdef CACHE_RAYS
            hitRecord0.x = -1.0;
          #else
            // Derivative-free conservative filtering for this exceptional hit.
            return vec4(diskEmission(r, phi, travelTime, shift, vec2(0.15, 0.04)), opacity);
          #endif
        }
        hitCount++;
        return vec4(0.0, 0.0, 0.0, opacity);
      }

      vec4 shadeHit(vec4 record, float opacity, vec2 footprint) {
        if (record.x == 0.0) return vec4(0.0);
        return vec4(diskEmission(record.x, record.y, record.z, record.w, footprint), opacity);
      }

      // Differentiate the circular chart, not atan's discontinuous phi value.
      // Propagation-delay gradients also change the retarded orbital phase.
      vec2 diskFootprint(vec4 record) {
        float radialWidth = abs(dFdx(record.x)) + abs(dFdy(record.x));
        vec2 angular = vec2(cos(record.y), sin(record.y));
        float angularWidth = length(dFdx(angular)) + length(dFdy(angular));
        float omega = sqrt(0.5) / pow(max(record.x, R_IN), 1.5);
        angularWidth += omega * (abs(dFdx(record.z)) + abs(dFdy(record.z)));
        return vec2(radialWidth, angularWidth);
      }

      vec3 shadeRecords(vec4 first, vec4 second, vec2 opacity) {
        // Execute both derivatives before any hit-dependent branch.
        vec2 footprint0 = diskFootprint(first);
        vec2 footprint1 = diskFootprint(second);
        vec4 disk0 = shadeHit(first, opacity.x, footprint0);
        vec4 disk1 = shadeHit(second, opacity.y, footprint1);
        return disk0.rgb * disk0.a + (1.0 - disk0.a) * disk1.rgb * disk1.a;
      }

      #ifdef DIRECT_OUTPUT
        ${filmGrade}
      #endif

      void main() {
        vec2 c = gl_FragCoord.xy - 0.5 * uRes;

        // Framing hangs off the SHORTER edge, so a tall phone viewport does not
        // blow the ring off both sides. On landscape this is the height, i.e.
        // unchanged. pn stays -1..1 on both axes for aspect-stable vignetting.
        float s  = min(uRes.x, uRes.y);
        vec2  p  = c / s;
        vec2  pn = c / uRes * 2.0;

        #ifdef SHADE_CACHED_RAYS
          ivec2 pixel = ivec2(gl_FragCoord.xy);
          vec4 firstHit = texelFetch(uHit0, pixel, 0);
          vec4 backdrop = texelFetch(uBackdrop, pixel, 0);
          vec4 secondHit = texelFetch(uHit1, pixel, 0);
          vec2 opacity = vec2(backdrop.a, texelFetch(uOpacity1, pixel, 0).r);
          vec3 col = shadeRecords(firstHit, secondHit, opacity);
          float transmission = (1.0 - opacity.x) * (1.0 - opacity.y);
          col += transmission * backdrop.rgb;
          col *= clamp(1.0 - 0.30 * pow(length(pn * vec2(0.86, 1.0)), 2.4), 0.0, 1.0);
          gl_FragColor = vec4(max(col, 0.0), 1.0);
        #else

        vec2 pc = p - uCenter;

        vec3 localDir = normalize(uRight * pc.x + uUp * pc.y + uFwd * uFocal);
        vec3 pos = uCamPos;
        vec3 radial = normalize(pos);
        vec3 radialDir = radial * dot(localDir, radial);
        // Static local camera direction -> affine coordinate velocity, scaled to
        // conserved E=1. The coordinate vector is not a local unit light velocity.
        vec3 dir = radialDir + (localDir - radialDir) * inversesqrt(1.0 - RS / length(pos));

        // Constants of the continuous orbit; RK4 reduces their numerical drift.
        vec3  L  = cross(pos, dir);
        float h2 = dot(L, L);
        float b = sqrt(h2);
        const float B_CRIT = 2.598076211; // 3 sqrt(3) Rs / 2
        // Critical orbits amplify accumulated error: refine their entire path,
        // not just the small neighborhood of the photon sphere. Smoothly varying
        // the step size avoids a numerical seam between quality regions.
        float stepFraction = mix(0.04, 0.10, smoothstep(0.01, 0.08, abs(b - B_CRIT)));

        vec3 acc = vec3(0.0);
        float transmission = 1.0;
        float travelTime = 0.0;
        bool escaped = false;

        for (int i = 0; i < 512; i++) {
          float r = length(pos);
          if (r < RS) break;                                          // through the horizon
          if (r > R_ESC && dot(pos, dir) > 0.0) {
            // All rays start inward outside the photon sphere. Below the exact
            // capture threshold, numerical drift must never reveal background.
            escaped = b > B_CRIT;
            break;
          }

          float dl = min(1.2, stepFraction * r / length(dir));
          vec3 prev = pos;
          vec3 prevV = dir;
          float dt;
          rayStep(prev, prevV, h2, dl, pos, dir, dt);

          if (prev.y * pos.y < 0.0) {
            // Refine the crossing along the curved orbit, then evaluate position,
            // velocity and delay at the same affine parameter (not the step end).
            float hitStep = dl * prev.y / (prev.y - pos.y);
            vec3 hit, hitV;
            float hitTime;
            rayStep(prev, prevV, h2, hitStep, hit, hitV, hitTime);
            if (abs(hitV.y) > 1e-7) {
              hitStep = clamp(hitStep - hit.y / hitV.y, 0.0, dl);
              rayStep(prev, prevV, h2, hitStep, hit, hitV, hitTime);
            }
            vec4 disk = diskSample(hit, hitV, travelTime + hitTime);
            acc += transmission * disk.rgb * disk.a;
            transmission *= 1.0 - disk.a;
            if (transmission < 0.005) break;
          }
          travelTime += dt;
        }

        vec3 col = acc;
        vec3 skyDir = normalize(dir);
        if (escaped) skyDir = escapeDirection(pos, L);
        // Evaluate derivatives after reconvergence, including non-escaping pixels.
        vec3 skyDx = dFdx(skyDir);
        vec3 skyDy = dFdy(skyDir);
        vec3 background = vec3(0.0);
        if (escaped) background = sky(skyDir, skyDx, skyDy);
        // Budget exhaustion is unresolved, not physical capture: retain known
        // disk emission but add sky only after a verified outward escape.
        if (escaped) {
          col += transmission * background;
        }

        #ifdef CACHE_RAYS
          gl_FragColor = hitRecord0;
          cachedHit1 = hitRecord1;
          cachedBackdrop = vec4(background, hitOpacity.x);
          cachedOpacity1 = vec4(hitOpacity.y, 0.0, 0.0, 0.0);
        #else
        col += shadeRecords(hitRecord0, hitRecord1, hitOpacity);
        col *= clamp(1.0 - 0.30 * pow(length(pn * vec2(0.86, 1.0)), 2.4), 0.0, 1.0);

        gl_FragColor = vec4(max(col, 0.0), 1.0);
        #endif
        #endif
        #ifdef DIRECT_OUTPUT
          vec3 gradeHDR = gl_FragColor.rgb;
          #include <tonemapping_fragment>
          gl_FragColor.rgb = filmGrade(gl_FragColor.rgb, gradeHDR, toneMappingExposure);
          #include <colorspace_fragment>
        #endif
      }
    `;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
    // A filmic highlight shoulder keeps warm midtones and a near-white bright side.
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.78;
    const supportsFloatColor = renderer.extensions.has('EXT_color_buffer_float');
    const supportsHDR = supportsFloatColor || renderer.extensions.has('EXT_color_buffer_half_float');

    const scene    = new THREE.Scene();
    const camera   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const material = new THREE.ShaderMaterial({
      uniforms, vertexShader: vert, fragmentShader: frag,
      defines: supportsHDR ? {} : { DIRECT_OUTPUT: 1 },
      depthTest: false, depthWrite: false
    });
    const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(screenMesh);

    // Without float color attachments, draw to the canvas with the same output
    // transform. Skip HDR bloom rather than allocating incomplete render targets.
    const composer = supportsHDR ? new EffectComposer(renderer) : null;
    const bloom = supportsHDR ? new UnrealBloomPass(new THREE.Vector2(1, 1), 0.09, 0.12, 2.00) : null;
    if (composer) {
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(bloom);
      const outputPass = new OutputPass();
      const outputFragment = outputPass.material.fragmentShader;
      const outputAnchors = ['void main()', 'gl_FragColor = texture2D( tDiffuse, vUv );', '// color space'];
      // Extend only the pinned OutputPass instance, without a new pass/target.
      // If its layout changes, keep a working ordinary tone-mapped output.
      if (outputAnchors.every(anchor => outputFragment.split(anchor).length === 2)) {
        outputPass.material.fragmentShader = outputFragment
          .replace('void main()', filmGrade + '\nvoid main()')
          .replace('gl_FragColor = texture2D( tDiffuse, vUv );',
                   'gl_FragColor = texture2D( tDiffuse, vUv );\nvec3 gradeHDR = gl_FragColor.rgb;')
          .replace('// color space',
                   'gl_FragColor.rgb = filmGrade(gl_FragColor.rgb, gradeHDR, toneMappingExposure);\n// color space');
        outputPass.material.needsUpdate = true;
      } else {
        console.warn('OutputPass layout changed; using its standard display transform.');
      }
      composer.addPass(outputPass);
      // Full-screen color passes never consume depth; avoid unused GPU storage.
      for (const target of [
        composer.renderTarget1, composer.renderTarget2, bloom.renderTargetBright,
        ...bloom.renderTargetsHorizontal, ...bloom.renderTargetsVertical
      ]) target.depthBuffer = false;
    }

    // The camera, trajectories, opacity and stars are static. Cache their exact
    // per-pixel float32 values; only disk emission needs evaluating every frame.
    // Three RGBA32F targets + one R32F target cost 52 bytes per render pixel.
    // Unsupported/incomplete float targets use the original shader at full quality.
    const gl = renderer.getContext();
    let rayCache = null;
    let cacheDirty = true;
    let cacheWarmupFrames = 0;
    const traceMaterial = new THREE.ShaderMaterial({
      uniforms, vertexShader: vert, fragmentShader: frag, defines: { CACHE_RAYS: 1 },
      depthTest: false, depthWrite: false, blending: THREE.NoBlending
    });
    const cachedMaterial = new THREE.ShaderMaterial({
      uniforms, vertexShader: vert, fragmentShader: frag, defines: { SHADE_CACHED_RAYS: 1 },
      depthTest: false, depthWrite: false, blending: THREE.NoBlending
    });
    if (supportsFloatColor) {
      rayCache = new THREE.WebGLRenderTarget(1, 1, {
        count: 4, type: THREE.FloatType, minFilter: THREE.NearestFilter,
        magFilter: THREE.NearestFilter, depthBuffer: false, stencilBuffer: false
      });
      rayCache.textures[3].format = THREE.RedFormat;
      rayCache.textures[3].internalFormat = 'R32F';
      uniforms.uHit0.value = rayCache.textures[0];
      uniforms.uHit1.value = rayCache.textures[1];
      uniforms.uBackdrop.value = rayCache.textures[2];
      uniforms.uOpacity1.value = rayCache.textures[3];
    }

    function renderScene() {
      if (rayCache && cacheDirty) {
        // Frame intervals include the previous draw. Exclude this one-off build
        // and its following interval from steady-state quality measurements.
        cacheWarmupFrames = 2;
        const previousTarget = renderer.getRenderTarget();
        renderer.setRenderTarget(rayCache);
        let usableCache = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
        if (usableCache) {
          screenMesh.material = traceMaterial;
          renderer.render(scene, camera);
          // One readback per rebuild, never per animation frame. RGBA/FLOAT is
          // portable for this RGBA32F attachment; RED/FLOAT is not guaranteed.
          try {
            const hits = new Float32Array(rayCache.width * rayCache.height * 4);
            renderer.readRenderTargetPixels(rayCache, 0, 0, rayCache.width, rayCache.height, hits);
            usableCache = gl.getError() === gl.NO_ERROR;
            for (let i = 0; i < hits.length; i += 4) {
              if (hits[i] < 0) { usableCache = false; break; }
            }
          } catch {
            usableCache = false;
          }
        }
        renderer.setRenderTarget(previousTarget);
        if (usableCache) {
          screenMesh.material = cachedMaterial;
          cacheDirty = false;
        } else {
          rayCache.dispose();
          rayCache = null;
          screenMesh.material = material;
          if (coverageSamples > 1) { allowCoverage = false; resize(); }
        }
      }
      if (composer) composer.render();
      else renderer.render(scene, camera);
    }

    let quality = 1;   // keep a lower resolution only when it improves frame time
    let allowCoverage = true, lastCoverage = true, coverageSamples = 1;
    let lastW = 0, lastH = 0, lastDpr = 0;
    let lastDisplayDpr = 0;
    let frameId = 0, contextLost = false;
    let elapsed = 0, last = performance.now();
    let sampled = 0, sampleAcc = 0, stepDowns = 0;
    let trialFrameTime = 0, qualityBeforeTrial = 1, qualityLocked = false;
    let coverageBeforeTrial = true;
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

    function requestFrame() {
      if (!frameId && !contextLost && !document.hidden) frameId = requestAnimationFrame(frame);
    }

    function pause() {
      cancelAnimationFrame(frameId);
      frameId = 0;
      last = performance.now();
      sampled = 0; sampleAcc = 0;
    }

    function resize() {
      if (contextLost) return;
      // Never size to 0: a zero-size attachment makes every framebuffer
      // incomplete, and the composer does not recover once that has happened.
      const w = Math.max(1, window.innerWidth  || document.documentElement.clientWidth || 1);
      const h = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
      const displayDpr = window.devicePixelRatio || 1;
      if (w !== lastW || h !== lastH || displayDpr !== lastDisplayDpr) {
        // A different viewport invalidates the timing comparison, and may need
        // much less GPU work. Start its quality evaluation at full resolution.
        quality = 1; allowCoverage = true; stepDowns = 0; qualityLocked = false;
        trialFrameTime = 0; sampled = 0; sampleAcc = 0;
        lastDisplayDpr = displayDpr;
      }
      // Apply quality after the display/pixel caps so every step lowers the load.
      const baseDpr = Math.min(displayDpr, 2, Math.sqrt(MAX_PIXELS / (w * h)));
      const dpr = baseDpr * quality;

      // Reallocating the composer targets is not free, and ResizeObserver also
      // fires once on observe.
      if (w === lastW && h === lastH && dpr === lastDpr && allowCoverage === lastCoverage) return;
      lastW = w; lastH = h; lastDpr = dpr; lastCoverage = allowCoverage;

      // Use integer buffer sizes at pixel ratio 1, including in a collapsed view.
      const outputW = Math.min(MAX_PIXELS, Math.max(1, Math.floor(w * dpr)));
      const outputH = Math.min(Math.floor(MAX_PIXELS / outputW), Math.max(1, Math.floor(h * dpr)));
      const baseW = Math.max(1, Math.floor(w * baseDpr));
      const baseH = Math.max(1, Math.floor(h * baseDpr));
      const viewportLimit = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
      const targetLimit = Math.min(renderer.capabilities.maxTextureSize,
          gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), viewportLimit[0], viewportLimit[1]);
      // Four-ray coverage only when it fits alongside the native output. Choose
      // from the base quality so adaptive step-downs always reduce GPU work.
      const samples = supportsFloatColor && rayCache && allowCoverage && baseW * baseH * 4 <= MAX_PIXELS &&
          Math.max(baseW, baseH) * 2 <= targetLimit ? 2 : 1;
      coverageSamples = samples;
      const renderW = outputW * samples;
      const renderH = outputH * samples;
      renderer.setSize(outputW, outputH, false);
      composer?.setSize(renderW, renderH);
      uniforms.uRes.value.set(renderW, renderH);
      // OutputPass linearly averages the 2x2 HDR coverage samples before its
      // tone mapping and sRGB conversion; all composer targets use LinearFilter.

      // Leave room for the outer disk, including in a portrait viewport.
      const aspect = w / h;
      const landscape = THREE.MathUtils.smoothstep(aspect, 0.85, 1.50);
      const shift = landscape * 0.04 * aspect;
      uniforms.uCenter.value.set(shift, 0);
      uniforms.uFocal.value = THREE.MathUtils.lerp(0.88, FOCAL, landscape);
      if (rayCache) {
        rayCache.setSize(renderW, renderH);
        cacheDirty = true;
      }
      requestFrame();
    }

    function frame(now) {
      frameId = 0;
      if (contextLost || document.hidden) return;
      const frameTime = (now - last) / 1000;
      // Clamp animation time only; performance sampling needs the full duration.
      const dt = Math.min(frameTime, 0.1);
      last = now;
      if (!reducedMotion.matches) elapsed += dt;
      uniforms.uTime.value = elapsed;
      renderScene();
      canvas.classList.add('ready');
      if (reducedMotion.matches) return;

      // Trial less coverage first, then lower resolution below ~45 fps. A frame
      // cap is not GPU overload: if the trial does not improve timing by 10%,
      // restore its previous quality and stop probing until the viewport changes.
      if (cacheWarmupFrames > 0) {
        cacheWarmupFrames--;
        sampled = 0; sampleAcc = 0;
      } else if (!qualityLocked) {
        sampleAcc += frameTime;
        if (++sampled === 45) {
          const average = sampleAcc / sampled;
          sampled = 0; sampleAcc = 0;
          if (trialFrameTime > 0) {
            if (average > trialFrameTime * 0.9) {
              quality = qualityBeforeTrial;
              allowCoverage = coverageBeforeTrial;
              qualityLocked = true;
              resize();
            }
            trialFrameTime = 0;
          }
          if (!qualityLocked && average > 0.022 && stepDowns < 3) {
            trialFrameTime = average;
            qualityBeforeTrial = quality;
            coverageBeforeTrial = allowCoverage;
            if (coverageSamples > 1) allowCoverage = false;
            else { stepDowns++; quality *= 0.8; }
            resize();
          }
        }
      }
      requestFrame();
    }

    canvas.addEventListener('webglcontextlost', e => {
      e.preventDefault();
      contextLost = true;
      pause();
      // Release stale target listeners while the context is still lost. Deferring
      // this until reset/resize tries to delete handles from the previous context.
      composer?.dispose();
      for (const pass of composer?.passes ?? []) pass.dispose();
      if (rayCache) rayCache.dispose();
      traceMaterial.dispose();
      cachedMaterial.dispose();
      cacheDirty = true;
      canvas.classList.remove('ready');
    });
    canvas.addEventListener('webglcontextrestored', () => {
      contextLost = false;
      composer?.reset();
      lastW = 0;
      last = performance.now();
      resize();
    });
    document.addEventListener('visibilitychange', () => {
      pause();
      if (!document.hidden) { resize(); requestFrame(); }
    });
    reducedMotion.addEventListener('change', () => {
      pause();
      requestFrame();
    });

    let displayDprQuery;
    function watchDisplayDpr() {
      displayDprQuery?.removeEventListener('change', watchDisplayDpr);
      displayDprQuery = matchMedia(`(resolution: ${window.devicePixelRatio || 1}dppx)`);
      displayDprQuery.addEventListener('change', watchDisplayDpr);
      resize();
    }

    // Resolution can change without a resize, including while RAF is paused.
    watchDisplayDpr();
    addEventListener('resize', resize);
    // A window resize event alone misses the case where the page is laid out at
    // zero size (hidden tab, collapsed container) and only gets a box later, so
    // the scene would stay stuck at the 1x1 floor.
    new ResizeObserver(resize).observe(document.documentElement);

  </script>
</body>
</html>
