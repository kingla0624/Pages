<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>kingla.cn</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    /* Static fallback: painted immediately, and all that is left if the
       module never runs (no WebGL, no JS, CDN unreachable). */
    body {
      background:
        radial-gradient(46% 34% at 64% 50%, rgba(255, 176, 96, 0.13), transparent 66%),
        radial-gradient(120% 96% at 16% 10%, rgba(150, 96, 58, 0.14), transparent 62%),
        radial-gradient(92% 74% at 82% 90%, rgba(74, 92, 156, 0.09), transparent 68%),
        #04040a;
    }

    #sky {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    #sky.ready { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      #sky { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

    const canvas = document.getElementById('sky');

    // A slightly elevated view separates the near disk from its lensed image.
    // Schwarzschild geometry; the warm visible palette is an artistic mapping.
    const DIST = 22.0;
    const INCL = 9.0 * Math.PI / 180;
    const CAM = new THREE.Vector3(0, DIST * Math.sin(INCL), -DIST * Math.cos(INCL));
    const FOCAL = 1.3;                 // half-height coordinates: fovY ~ 42 deg
    const MAX_PIXELS = 2.4e6;          // bound the ray integration and bloom cost

    const fwd   = CAM.clone().negate().normalize();
    const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), fwd).normalize();
    const up    = new THREE.Vector3().crossVectors(fwd, right).normalize();

    const uniforms = {
      uRes:    { value: new THREE.Vector2(1, 1) },
      uTime:   { value: 0 },
      uCamPos: { value: CAM },
      uRight:  { value: right },
      uUp:     { value: up },
      uFwd:    { value: fwd },
      uFocal:  { value: FOCAL },
      uCenter: { value: new THREE.Vector2(0, 0) }
    };

    const vert = `
      void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }
    `;

    const frag = `
      precision highp float;

      uniform vec2  uRes;
      uniform float uTime;
      uniform vec3  uCamPos;
      uniform vec3  uRight;
      uniform vec3  uUp;
      uniform vec3  uFwd;
      uniform float uFocal;
      uniform vec2  uCenter;

      const float RS    = 1.0;    // event horizon
      const float R_IN  = 3.00;   // inner edge of the disk: the ISCO, 6M
      const float R_OUT = 10.0;   // outer edge
      const float R_ESC = 28.0;   // treat the ray as escaped past this
      const float SPIN  = 0.85;   // visual time scale; differential orbital motion

      float hash13(vec3 p) {
        p = fract(p * 0.1031);
        p += dot(p, p.zyx + 31.32);
        return fract((p.x + p.y) * p.z);
      }

      float vnoise(vec3 p) {
        vec3 i = floor(p);
        vec3 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash13(i + vec3(0.0, 0.0, 0.0));
        float b = hash13(i + vec3(1.0, 0.0, 0.0));
        float c = hash13(i + vec3(0.0, 1.0, 0.0));
        float d = hash13(i + vec3(1.0, 1.0, 0.0));
        float e = hash13(i + vec3(0.0, 0.0, 1.0));
        float g = hash13(i + vec3(1.0, 0.0, 1.0));
        float h = hash13(i + vec3(0.0, 1.0, 1.0));
        float k = hash13(i + vec3(1.0, 1.0, 1.0));
        return mix(mix(mix(a, b, f.x), mix(c, d, f.x), f.y),
                   mix(mix(e, g, f.x), mix(h, k, f.x), f.y), f.z);
      }

      // Octave count is a parameter because the disk needs a band limit the
      // background does not: its texture is compressed hard by the lensing, so
      // a fourth octave there lands near the pixel pitch and crawls.
      float fbm(vec3 p, int oct) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 4; i++) {
          if (i >= oct) break;
          v += a * vnoise(p);
          p = p * 2.03 + 13.7;
          a *= 0.5;
        }
        return v;
      }

      // Null geodesic in Schwarzschild, Cartesian form. The force is central,
      // so h^2 = |r x v|^2 is conserved and is taken once from the initial ray.
      //   d2r/dl2 = -1.5 * h^2 * r / |r|^5      (equivalent to u'' + u = 3Mu^2)
      vec3 accel(vec3 p, float h2) {
        float r2 = dot(p, p);
        return -1.5 * h2 * p / (r2 * r2 * sqrt(r2));
      }

      // Fixed angular stars, convolved with a pixel footprint. Normalizing the
      // Gaussian keeps their energy from growing when rendering at lower quality.
      vec3 starLayer(vec3 d, float scale, float threshold, float pxAng) {
        vec2 uv = vec2(atan(d.z, d.x), asin(clamp(d.y, -1.0, 1.0))) * scale;
        vec2 id = floor(uv);
        float seed = hash13(vec3(id, scale));
        if (seed < threshold) return vec3(0.0);
        vec2 center = vec2(hash13(vec3(id, 2.7)), hash13(vec3(id, 9.1)));
        vec2 delta = fract(uv) - mix(vec2(0.2), vec2(0.8), center);
        float baseVariance = 0.0064;
        float footprint = pxAng * scale;
        float variance = baseVariance + footprint * footprint / 12.0;
        float light = exp(-0.5 * dot(delta, delta) / variance) * baseVariance / variance;
        float magnitude = 0.12 + 2.8 * pow(hash13(vec3(id, 19.3)), 8.0);
        vec3 tint = mix(vec3(0.76, 0.84, 1.0), vec3(1.0, 0.87, 0.72), center.x);
        return tint * light * magnitude;
      }

      vec3 sky(vec3 d, float pxAng) {
        vec3 c = starLayer(d, 160.0, 0.994, pxAng);
        c += starLayer(d, 310.0, 0.997, pxAng) * 0.4;
        // Very faint interstellar dust; all background light follows the ray.
        float dust = fbm(d * 3.0 + 11.3, 3);
        float band = exp(-18.0 * pow(d.y + d.x * 0.25, 2.0));
        c += vec3(0.11, 0.13, 0.18) * smoothstep(0.35, 0.8, dust) * band * 0.012;
        return c;
      }

      float diskNoise(float r, float phi, float age, float frequency, int octaves) {
        float a = phi - SPIN / (r * sqrt(r)) * age;
        vec3 q = vec3(cos(a) * 2.5, sin(a) * 2.5, r * frequency);
        return fbm(q, octaves) * (octaves == 2 ? 1.1667 : 1.0);
      }

      // Emission and opacity at a disk crossing, accumulated front to back.
      vec4 diskSample(vec3 hit, vec3 vel) {
        float r = length(hit);
        float u = (r - R_IN) / (R_OUT - R_IN);
        if (u < 0.0 || u > 1.0) return vec4(0.0);

        float phi = atan(hit.z, hit.x);
        float resolution = min(uRes.x, uRes.y);
        float frequency = mix(3.0, 6.0, smoothstep(400.0, 1000.0, resolution));
        int octaves = resolution < 700.0 ? 2 : 3;
        // Two staggered flow lifetimes keep differential shear from winding the
        // texture into sub-pixel noise over time. Each resets at zero weight.
        float age = mod(uTime, 48.0);
        float otherAge = mod(uTime + 24.0, 48.0);
        float blend = 0.5 - 0.5 * cos(age * 6.2831853 / 48.0);
        float n = mix(diskNoise(r, phi, otherAge, frequency, octaves),
                      diskNoise(r, phi, age, frequency, octaves), blend);
        float density = mix(0.18, 1.45, smoothstep(0.20, 0.72, n));

        // Zero-torque thin-disk radial flux peaks outside the inner boundary.
        float x = r / R_IN;
        float flux = pow(x, -3.0) * max(1.0 - inversesqrt(x), 0.0) / 0.05665;
        float temperature = pow(flux, 0.25);
        float edge = smoothstep(0.0, 0.035, u) * (1.0 - smoothstep(0.65, 1.0, u));

        vec3 nv = normalize(vel);
        vec3 vhat = normalize(cross(hit, vec3(0.0, 1.0, 0.0)));
        float beta = sqrt(1.0 / (2.0 * (r - RS)));
        float dop = sqrt(1.0 - beta * beta) / (1.0 - dot(vhat * beta, -nv));
        float shift = dop * sqrt(1.0 - RS / r);

        // Map temperature to visible amber/ivory; approaching gas is brighter
        // and hotter, while the receding side remains dimmer and warmer.
        float heat = clamp(temperature * pow(shift, 0.35), 0.0, 1.3);
        vec3 col = mix(vec3(0.48, 0.055, 0.008), vec3(1.0, 0.48, 0.12), smoothstep(0.30, 0.78, heat));
        col = mix(col, vec3(1.0, 0.88, 0.64), smoothstep(0.78, 1.20, heat));
        float emission = 1.6 * flux * density * pow(shift, 3.0);
        float opacity = edge * (1.0 - exp(-1.8 / max(abs(nv.y), 0.12)));
        return vec4(col * emission, opacity);
      }

      void main() {
        vec2 c = gl_FragCoord.xy - 0.5 * uRes;

        // Framing hangs off the SHORTER edge, so a tall phone viewport does not
        // blow the ring off both sides. On landscape this is the height, i.e.
        // unchanged. pn stays -1..1 on both axes for aspect-stable vignetting.
        float s  = min(uRes.x, uRes.y);
        vec2  p  = c / s;
        vec2  pn = c / uRes * 2.0;

        vec2 pc = p - uCenter;

        vec3 dir = normalize(uRight * pc.x + uUp * pc.y + uFwd * uFocal);
        vec3 pos = uCamPos;

        // The force below is central, so angular momentum is exactly conserved
        // and h^2 can be taken once from the initial ray.
        vec3  L  = cross(pos, dir);
        float h2 = dot(L, L);

        vec3 acc = vec3(0.0);
        float transmission = 1.0;
        bool escaped = false;

        for (int i = 0; i < 256; i++) {
          float r = length(pos);
          if (r < RS) break;                                          // through the horizon
          if (r > R_ESC && dot(pos, dir) > 0.0) { escaped = true; break; }

          float dl = clamp(0.055 * r, 0.02, 0.80) / max(length(dir), 0.35);

          // Midpoint step. Plain Euler at this step size over-bends the rays
          // near periapsis and visibly inflates the shadow.
          vec3 prev = pos;
          vec3 k1 = accel(pos, h2);
          vec3 k2 = accel(pos + dir * (0.5 * dl), h2);
          pos += (dir + k1 * (0.5 * dl)) * dl;
          dir += k2 * dl;

          if (prev.y * pos.y < 0.0) {
            float t = prev.y / (prev.y - pos.y);
            vec4 disk = diskSample(mix(prev, pos, t), dir);
            acc += transmission * disk.rgb * disk.a;
            transmission *= 1.0 - disk.a;
            if (transmission < 0.005) break;
          }
        }

        vec3 col = acc;
        // A ray still winding when the step budget runs out is captured in
        // practice; calling it escaped leaks grey sky inside the shadow.
        if (escaped) {
          col += transmission * sky(normalize(dir), 1.0 / (s * uFocal));
        }

        col *= clamp(1.0 - 0.30 * pow(length(pn * vec2(0.86, 1.0)), 2.4), 0.0, 1.0);

        gl_FragColor = vec4(max(col, 0.0), 1.0);
      }
    `;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    const scene    = new THREE.Scene();
    const camera   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const material = new THREE.ShaderMaterial({
      uniforms, vertexShader: vert, fragmentShader: frag,
      depthTest: false, depthWrite: false
    });
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.14, 0.15, 1.40);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    let quality = 1;   // resolution scale, ratcheted down only if the GPU lags
    let lastW = 0, lastH = 0, lastDpr = 0;
    let frameId = 0, contextLost = false;
    let elapsed = 0, last = performance.now();
    let sampled = 0, sampleAcc = 0, stepDowns = 0;
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

    function requestFrame() {
      if (!frameId && !contextLost && !document.hidden) frameId = requestAnimationFrame(frame);
    }

    function pause() {
      cancelAnimationFrame(frameId);
      frameId = 0;
      last = performance.now();
      sampled = 0; sampleAcc = 0;
    }

    function resize() {
      if (contextLost) return;
      // Never size to 0: a zero-size attachment makes every framebuffer
      // incomplete, and the composer does not recover once that has happened.
      const w = Math.max(1, window.innerWidth  || document.documentElement.clientWidth || 1);
      const h = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
      // Apply quality after the display/pixel caps so every step lowers the load.
      const baseDpr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(MAX_PIXELS / (w * h)));
      const dpr = baseDpr * quality;

      // Reallocating the composer targets is not free, and ResizeObserver also
      // fires once on observe.
      if (w === lastW && h === lastH && dpr === lastDpr) return;
      lastW = w; lastH = h; lastDpr = dpr;

      // Use integer buffer sizes at pixel ratio 1, including in a collapsed view.
      const renderW = Math.min(MAX_PIXELS, Math.max(1, Math.floor(w * dpr)));
      const renderH = Math.min(Math.floor(MAX_PIXELS / renderW), Math.max(1, Math.floor(h * dpr)));
      renderer.setSize(renderW, renderH, false);
      composer.setSize(renderW, renderH);
      uniforms.uRes.value.set(renderW, renderH);

      // Leave room for the outer disk, including in a portrait viewport.
      const aspect = w / h;
      const landscape = THREE.MathUtils.smoothstep(aspect, 0.85, 1.50);
      const shift = landscape * 0.04 * aspect;
      uniforms.uCenter.value.set(shift, 0);
      uniforms.uFocal.value = THREE.MathUtils.lerp(0.88, FOCAL, landscape);
      requestFrame();
    }

    function frame(now) {
      frameId = 0;
      if (contextLost || document.hidden) return;
      // Clamped so a backgrounded tab does not resume with a jump in the disk.
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      if (!reducedMotion.matches) elapsed += dt;
      uniforms.uTime.value = elapsed;
      composer.render();
      canvas.classList.add('ready');
      if (reducedMotion.matches) return;

      // Full resolution is the default; step down when a short window shows the
      // machine is not holding ~45 fps. A vsynced display quantises dt, so a
      // card that just misses 60 lands near 33 ms and trips this. One-way, so
      // it cannot oscillate.
      if (stepDowns < 3) {
        sampleAcc += dt;
        if (++sampled === 45) {
          if (sampleAcc / sampled > 0.022) { stepDowns++; quality *= 0.8; resize(); }
          sampled = 0; sampleAcc = 0;
        }
      }
      requestFrame();
    }

    canvas.addEventListener('webglcontextlost', e => {
      e.preventDefault();
      contextLost = true;
      pause();
      canvas.classList.remove('ready');
    });
    canvas.addEventListener('webglcontextrestored', () => {
      contextLost = false;
      composer.reset();
      lastW = 0;
      last = performance.now();
      resize();
    });
    document.addEventListener('visibilitychange', () => {
      pause();
      if (!document.hidden) { resize(); requestFrame(); }
    });
    reducedMotion.addEventListener('change', () => {
      pause();
      requestFrame();
    });

    resize();
    addEventListener('resize', resize);
    // A window resize event alone misses the case where the page is laid out at
    // zero size (hidden tab, collapsed container) and only gets a box later, so
    // the scene would stay stuck at the 1x1 floor.
    new ResizeObserver(resize).observe(document.documentElement);

  </script>
</body>
</html>
