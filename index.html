<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>kingla.cn</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    /* Static fallback: painted immediately, and all that is left if the
       module never runs (no WebGL, no JS, CDN unreachable). */
    body {
      background:
        radial-gradient(46% 34% at 64% 50%, rgba(255, 176, 96, 0.13), transparent 66%),
        radial-gradient(120% 96% at 16% 10%, rgba(150, 96, 58, 0.14), transparent 62%),
        radial-gradient(92% 74% at 82% 90%, rgba(74, 92, 156, 0.09), transparent 68%),
        #04040a;
    }

    #sky {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    #sky.ready { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      #sky { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

    const canvas = document.getElementById('sky');

    // Camera sits barely above the disk plane, so the lensed disk closes into a
    // near-symmetric ring with a thin needle of light through the middle. It
    // cannot be exactly 0: in-plane rays never cross the disk, which would drop
    // the near side of it entirely.
    const DIST = 20.0;
    const INCL = 3.0 * Math.PI / 180;
    const CAM = new THREE.Vector3(0, DIST * Math.sin(INCL), -DIST * Math.cos(INCL));
    const FOCAL = 1.6;                 // 1 / tan(fovY / 2)  ->  fovY ~ 64 deg
    const MAX_PIXELS = 9.0e6;          // backstop for very large displays only

    const fwd   = CAM.clone().negate().normalize();
    const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), fwd).normalize();
    const up    = new THREE.Vector3().crossVectors(fwd, right).normalize();

    const uniforms = {
      uRes:    { value: new THREE.Vector2(1, 1) },
      uTime:   { value: 0 },
      uCamPos: { value: CAM },
      uRight:  { value: right },
      uUp:     { value: up },
      uFwd:    { value: fwd },
      uFocal:  { value: FOCAL },
      uCenter: { value: new THREE.Vector2(0, 0) }
    };

    const vert = `
      void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }
    `;

    const frag = `
      precision highp float;

      uniform vec2  uRes;
      uniform float uTime;
      uniform vec3  uCamPos;
      uniform vec3  uRight;
      uniform vec3  uUp;
      uniform vec3  uFwd;
      uniform float uFocal;
      uniform vec2  uCenter;

      const float RS    = 1.0;    // event horizon
      const float R_IN  = 3.00;   // inner edge of the disk: the ISCO, 6M
      const float R_OUT = 5.80;   // outer edge
      const float R_ESC = 28.0;   // treat the ray as escaped past this
      const float SPIN  = 0.55;   // inner rim completes a turn in ~40 s

      float hash13(vec3 p) {
        p = fract(p * 0.1031);
        p += dot(p, p.zyx + 31.32);
        return fract((p.x + p.y) * p.z);
      }

      vec3 hash33(vec3 p) {
        p = vec3(dot(p, vec3(127.1, 311.7,  74.7)),
                 dot(p, vec3(269.5, 183.3, 246.1)),
                 dot(p, vec3(113.5, 271.9, 124.6)));
        return fract(sin(p) * 43758.5453123);
      }

      float vnoise(vec3 p) {
        vec3 i = floor(p);
        vec3 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash13(i + vec3(0.0, 0.0, 0.0));
        float b = hash13(i + vec3(1.0, 0.0, 0.0));
        float c = hash13(i + vec3(0.0, 1.0, 0.0));
        float d = hash13(i + vec3(1.0, 1.0, 0.0));
        float e = hash13(i + vec3(0.0, 0.0, 1.0));
        float g = hash13(i + vec3(1.0, 0.0, 1.0));
        float h = hash13(i + vec3(0.0, 1.0, 1.0));
        float k = hash13(i + vec3(1.0, 1.0, 1.0));
        return mix(mix(mix(a, b, f.x), mix(c, d, f.x), f.y),
                   mix(mix(e, g, f.x), mix(h, k, f.x), f.y), f.z);
      }

      // Octave count is a parameter because the disk needs a band limit the
      // background does not: its texture is compressed hard by the lensing, so
      // a fourth octave there lands near the pixel pitch and crawls.
      float fbm(vec3 p, int oct) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 4; i++) {
          if (i >= oct) break;
          v += a * vnoise(p);
          p = p * 2.03 + 13.7;
          a *= 0.5;
        }
        return v;
      }

      // Null geodesic in Schwarzschild, Cartesian form. The force is central,
      // so h^2 = |r x v|^2 is conserved and is taken once from the initial ray.
      //   d2r/dl2 = -1.5 * h^2 * r / |r|^5      (equivalent to u'' + u = 3Mu^2)
      vec3 accel(vec3 p, float h2) {
        float r2 = dot(p, p);
        return -1.5 * h2 * p / (r2 * r2 * sqrt(r2));
      }

      // One octave of stars. sigma follows the pixel footprint so the dots stay
      // about a pixel wide instead of shimmering when the buffer is resized.
      vec3 starLayer(vec3 d, float scale, float thresh, float pxCells) {
        vec3 id = floor(d * scale);
        vec3 f  = fract(d * scale) - 0.5;
        vec3 r  = hash33(id);
        if (r.z < thresh) return vec3(0.0);

        float sigma = max(pxCells * 0.85, 0.030);
        float dist  = length(f - (r - 0.5) * 0.60);
        float core  = exp(-(dist * dist) / (2.0 * sigma * sigma));

        float mag  = pow(hash13(id + 7.3), 4.0);
        float tint = hash13(id + 19.1);
        vec3  hue  = mix(vec3(0.74, 0.83, 1.00), vec3(1.00, 0.86, 0.66),
                         smoothstep(0.30, 0.85, tint));
        hue = mix(vec3(1.0), hue, 0.6);

        float tw = 1.0 + 0.15 * sin(uTime * (0.5 + r.x * 1.3) + r.y * 40.0);
        return hue * core * (0.10 + mag * 1.45) * tw;
      }

      // A distant edge-on galaxy: a flat elongated smudge with a soft halo.
      // d is already isotropic in pixels, measured in units of half-height.
      vec3 galaxy(vec2 d, float rot, float size) {
        float cs = cos(rot), sn = sin(rot);
        vec2 q = vec2(d.x * cs - d.y * sn, d.x * sn + d.y * cs) / size;
        q.y *= 4.5;                       // flatten it into a disc seen edge-on
        float r2 = dot(q, q);
        return vec3(0.62, 0.52, 0.42) * exp(-r2 * 3.2) * 0.55
             + vec3(0.30, 0.34, 0.46) * exp(-r2 * 0.70) * 0.16;
      }

      // Parked in pn space so the composition holds at any aspect ratio; only
      // the delta is corrected so they do not stretch on wide viewports.
      vec3 galaxies(vec2 pn, float aspect) {
        vec2 k = vec2(aspect, 1.0);
        return galaxy((pn - vec2(-0.80,  0.42)) * k, -0.38, 0.150)
             + galaxy((pn - vec2( 0.62,  0.55)) * k,  0.30, 0.115)
             + galaxy((pn - vec2( 0.90,  0.02)) * k, -0.22, 0.135)
             + galaxy((pn - vec2( 0.74, -0.58)) * k,  0.34, 0.100);
      }

      vec3 sky(vec3 d, vec2 p, float pxAng) {
        vec3 c = vec3(0.0);
        c += starLayer(d, 140.0, 0.966, pxAng * 140.0) * 1.00;
        c += starLayer(d, 340.0, 0.948, pxAng * 340.0) * 0.55;
        c += starLayer(d, 760.0, 0.936, pxAng * 760.0) * 0.28;

        // Warm dust bank in the upper left, faint cold wash lower right.
        float n  = fbm(d * 2.1 + 11.3, 4);
        float n2 = fbm(d * 5.3 +  3.7, 4);

        float warm = smoothstep(0.30, 1.05, n * 0.75 + n2 * 0.35);
        warm *= smoothstep(0.75, -0.35, p.x * 1.1 - p.y * 0.9);
        c += vec3(0.34, 0.19, 0.11) * warm * 0.10;

        float cold = smoothstep(0.42, 1.00, n2 * 0.8 + n * 0.3);
        cold *= smoothstep(-0.55, 0.85, p.x * 0.8 + p.y * 0.6);
        c += vec3(0.10, 0.13, 0.26) * cold * 0.07;

        return c;
      }

      // Emission picked up where the ray crosses the disk plane. Called once per
      // crossing, so the far side lensed over the top adds itself on its own.
      vec3 diskSample(vec3 hit, vec3 vel) {
        float r = length(hit);
        float u = (r - R_IN) / (R_OUT - R_IN);
        if (u < 0.0 || u > 1.0) return vec3(0.0);

        float phi   = atan(hit.z, hit.x);
        float omega = SPIN / (r * sqrt(r));            // Keplerian: inner rim leads
        float a     = phi - omega * uTime;

        // Sampling on a circle in xy keeps the texture seamless across phi = +-pi.
        // Along the lensed arc, screen position tracks the disk's AZIMUTH, so a
        // high azimuthal frequency against a low radial one is what draws the
        // fine comb of streaks across the ring - and it sweeps visibly as the
        // disk turns. Low-frequency blobs rotate almost invisibly.
        vec3 q = vec3(cos(a), sin(a), 0.0) * 9.0 + vec3(0.0, 0.0, r * 0.9);
        float n = fbm(q, 3);
        float dens = 0.45 + 0.55 * n;

        float radial = smoothstep(0.0, 0.08, u) * pow(1.0 - u, 3.0);
        float emit = radial * dens * (9.5 / (0.30 + r * 0.20));

        // Optically thin slab: a grazing ray travels further through it.
        vec3 nv = normalize(vel);
        emit *= clamp(0.055 / max(abs(nv.y), 0.004), 0.40, 2.5);

        vec3 col = mix(vec3(1.00, 0.93, 0.82), vec3(1.00, 0.64, 0.28),
                       smoothstep(0.0, 0.28, u));
        col = mix(col, vec3(0.80, 0.30, 0.09), smoothstep(0.28, 1.0, u));

        // Relativistic beaming: the limb rotating toward us runs far brighter.
        vec3  vhat = normalize(cross(hit, vec3(0.0, 1.0, 0.0)));
        float beta = clamp(0.46 / sqrt(r), 0.0, 0.80);
        float gam  = 1.0 / sqrt(max(1.0 - beta * beta, 1e-3));
        float dop  = clamp(1.0 / (gam * (1.0 - dot(vhat * beta, -nv))), 0.42, 2.80);
        float grav = sqrt(max(1.0 - RS / r, 0.02));    // gravitational redshift

        // Brightness follows the beaming, but the receding limb is tinted cool
        // rather than red: that cold rim is the reference art's look, not physics.
        col = mix(col, vec3(1.00, 0.97, 0.92), clamp((dop - 1.0) * 0.50, 0.0, 0.45));
        col = mix(col, vec3(0.72, 0.80, 1.00), clamp((1.0 - dop) * 0.85, 0.0, 0.55));

        return col * emit * pow(dop, 2.6) * pow(grav, 1.4);
      }

      void main() {
        vec2 c = gl_FragCoord.xy - 0.5 * uRes;

        // Framing hangs off the SHORTER edge, so a tall phone viewport does not
        // blow the ring off both sides. On landscape this is the height, i.e.
        // unchanged. pn stays -1..1 on both axes for aspect-stable vignetting.
        float s  = min(uRes.x, uRes.y);
        vec2  p  = c / s;
        vec2  pn = c / uRes * 2.0;

        // Sub-pixel jitter turns the edge-on disk aliasing into grain.
        vec2 jit = (vec2(hash13(vec3(gl_FragCoord.xy, 1.0)),
                         hash13(vec3(gl_FragCoord.yx, 7.0))) - 0.5) / s;
        vec2 pc = p + jit - uCenter;

        vec3 dir = normalize(uRight * pc.x + uUp * pc.y + uFwd * uFocal);
        vec3 pos = uCamPos;

        // The force below is central, so angular momentum is exactly conserved
        // and h^2 can be taken once from the initial ray.
        vec3  L  = cross(pos, dir);
        float h2 = dot(L, L);

        vec3 acc = vec3(0.0);
        bool escaped = false;

        for (int i = 0; i < 256; i++) {
          float r = length(pos);
          if (r < RS) break;                                          // through the horizon
          if (r > R_ESC && dot(pos, dir) > 0.0) { escaped = true; break; }

          float dl = clamp(0.055 * r, 0.02, 0.80) / max(length(dir), 0.35);

          // Midpoint step. Plain Euler at this step size over-bends the rays
          // near periapsis and visibly inflates the shadow.
          vec3 prev = pos;
          vec3 k1 = accel(pos, h2);
          vec3 k2 = accel(pos + dir * (0.5 * dl), h2);
          pos += (dir + k1 * (0.5 * dl)) * dl;
          dir += k2 * dl;

          if (prev.y * pos.y < 0.0) {
            float t = prev.y / (prev.y - pos.y);
            acc += diskSample(mix(prev, pos, t), dir);
          }
        }

        vec3 col = acc;
        // A ray still winding when the step budget runs out is captured in
        // practice; calling it escaped leaks grey sky inside the shadow.
        if (escaped) {
          col += sky(normalize(dir), p, 1.0 / (s * uFocal));
          col += galaxies(pn, uRes.x / uRes.y);
        }

        col *= clamp(1.0 - 0.30 * pow(length(pn * vec2(0.86, 1.0)), 2.4), 0.0, 1.0);
        col += (hash13(vec3(gl_FragCoord.xy, 3.0)) - 0.5) * 0.008;

        gl_FragColor = vec4(max(col, 0.0), 1.0);
      }
    `;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    const scene    = new THREE.Scene();
    const camera   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const material = new THREE.ShaderMaterial({
      uniforms, vertexShader: vert, fragmentShader: frag,
      depthTest: false, depthWrite: false
    });
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.55, 0.15, 2.50);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    let quality = 1;   // resolution scale, ratcheted down only if the GPU lags
    let lastW = 0, lastH = 0, lastDpr = 0;

    function resize() {
      // Never size to 0: a zero-size attachment makes every framebuffer
      // incomplete, and the composer does not recover once that has happened.
      const w = Math.max(1, window.innerWidth  || document.documentElement.clientWidth);
      const h = Math.max(1, window.innerHeight || document.documentElement.clientHeight);
      // Match the display 1:1 by default. Rendering below devicePixelRatio and
      // letting the browser upscale is what makes the ring look soft.
      const dpr = Math.max(0.6, Math.min((window.devicePixelRatio || 1) * quality, 2,
                                         Math.sqrt(MAX_PIXELS / (w * h))));

      // Reallocating the composer targets is not free, and ResizeObserver also
      // fires once on observe.
      if (w === lastW && h === lastH && dpr === lastDpr) return;
      lastW = w; lastH = h; lastDpr = dpr;

      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h, false);
      composer.setPixelRatio(dpr);
      composer.setSize(w, h);

      uniforms.uRes.value.set(w * dpr, h * dpr);

      // Park the hole right of centre on wide viewports, dead centre on phones.
      const aspect = w / h;
      const shift = THREE.MathUtils.smoothstep(aspect, 0.95, 1.50) * 0.15 * aspect;
      uniforms.uCenter.value.set(shift, 0);
    }

    let elapsed = 0;
    let last = performance.now();
    let sampled = 0, sampleAcc = 0, stepDowns = 0;

    function frame(now = last) {
      requestAnimationFrame(frame);
      // Clamped so a backgrounded tab does not resume with a jump in the disk.
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      elapsed += dt;
      uniforms.uTime.value = elapsed;
      composer.render();
      canvas.classList.add('ready');

      // Full resolution is the default; step down when a short window shows the
      // machine is not holding ~45 fps. A vsynced display quantises dt, so a
      // card that just misses 60 lands near 33 ms and trips this. One-way, so
      // it cannot oscillate.
      if (stepDowns < 3) {
        sampleAcc += dt;
        if (++sampled === 45) {
          if (sampleAcc / sampled > 0.022) { stepDowns++; quality *= 0.8; resize(); }
          sampled = 0; sampleAcc = 0;
        }
      }
    }

    // Without preventDefault the browser never restores a lost context and the
    // canvas stays black for good. Driver resets and mobile backgrounding do
    // happen; forcing lastW to 0 makes the restore path rebuild the targets.
    canvas.addEventListener('webglcontextlost', e => e.preventDefault());
    canvas.addEventListener('webglcontextrestored', () => { lastW = 0; resize(); });

    resize();
    addEventListener('resize', resize);
    // A window resize event alone misses the case where the page is laid out at
    // zero size (hidden tab, collapsed container) and only gets a box later, so
    // the scene would stay stuck at the 1x1 floor.
    new ResizeObserver(resize).observe(document.documentElement);

    frame();
  </script>
</body>
</html>
