<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="用原生 SVG 绘制的鹈鹕海岸骑行：联动的脚踏、车轮、海风与海浪。一个可以离线打开的单文件动画。">
  <meta name="theme-color" content="#f6f0e5">
  <title>鹈鹕的海岸骑行 · Pelican Coast Ride</title>
  <style>
    :root { color-scheme: light; --paper:#f6f0e5; --ink:#183f40; --muted:#697974; --line:#b8c1b3; --accent:#2f716b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Palatino Linotype","Songti SC","STSong","Noto Serif CJK SC",serif; transition:background .7s,color .7s; }
    body.sunset { --paper:#f3dfc9; --ink:#4e3b3b; --muted:#7c6260; --line:#bca393; --accent:#965d51; }
    .page { max-width:1600px; margin:auto; padding:29px 46px 20px; }
    .masthead { display:flex; align-items:center; gap:22px; font-size:11px; letter-spacing:3.8px; white-space:nowrap; }
    .masthead::after { content:""; flex:1; height:1px; background:var(--ink); opacity:.65; }
    .edition { order:1; }
    .intro { position:relative; z-index:1; margin:42px 0 -34px; pointer-events:none; }
    h1 { font-size:clamp(32px,5.2vw,74px); font-weight:600; line-height:1.22; letter-spacing:.035em; margin:0; }
    .intro p { font-size:clamp(12px,1.4vw,19px); letter-spacing:.12em; margin:19px 0 0 3px; line-height:1.8; }
    .scene { margin:0 -46px; overflow:hidden; }
    .scene svg { display:block; width:100%; height:auto; }
    .sky-stop { stop-color:#f7d6ae; transition:stop-color .8s; }
    .sun { fill:#f6cf86; transition:fill .8s; }
    .sea-base { fill:#9abdb2; transition:fill .8s; }
    .sea-far { fill:#baccc0; transition:fill .8s; }
    .sunset .sky-stop { stop-color:#eaa37f; }
    .sunset .sun { fill:#efae6f; }
    .sunset .sea-base { fill:#879f9b; }
    .sunset .sea-far { fill:#b6aaa0; }
    .controls { display:flex; align-items:center; justify-content:flex-end; gap:28px; padding:22px 0 23px; }
    button, input { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; color:inherit; cursor:pointer; }
    button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:6px; }
    .play { display:flex; align-items:center; gap:13px; padding:0; border:0; background:none; min-height:44px; font-size:14px; letter-spacing:.13em; min-width:90px; }
    .play-symbol { display:grid; place-items:center; width:42px; height:42px; background:var(--ink); color:var(--paper); border-radius:50%; transition:transform .2s; }
    .play:hover .play-symbol { transform:scale(1.08); }
    .play-symbol svg { width:18px; height:18px; }
    .speed { display:flex; align-items:center; gap:17px; padding-left:27px; border-left:1px solid var(--line); font-size:14px; letter-spacing:.08em; }
    input[type=range] { width:135px; height:32px; accent-color:var(--ink); cursor:pointer; }
    output { font-variant-numeric:tabular-nums; min-width:37px; letter-spacing:0; }
    .theme { display:flex; align-items:center; gap:19px; min-height:44px; padding:0 0 0 27px; border:0; border-left:1px solid var(--line); background:none; font-size:14px; letter-spacing:.1em; }
    .switch { display:block; width:48px; height:26px; border:1px solid var(--ink); border-radius:30px; padding:3px; }
    .switch::before { content:""; display:block; width:18px; height:18px; border-radius:50%; background:var(--ink); transition:transform .3s; }
    .theme[aria-checked=true] .switch::before { transform:translateX(21px); }
    .hint { font-size:12px; color:var(--muted); padding-left:27px; border-left:1px solid var(--line); letter-spacing:.07em; }
    kbd { font:inherit; }
    footer { border-top:1px solid var(--line); padding-top:13px; display:flex; justify-content:space-between; align-items:center; font-size:11px; letter-spacing:3.6px; }
    .closing { font-size:12px; letter-spacing:.2em; }
    @media (min-width:1601px) { .intro { margin-top:48px; } }
    @media (max-width:900px) {
      .page { padding:24px 26px 20px; }
      .masthead { font-size:9px; letter-spacing:2px; gap:14px; }
      .intro { margin-top:36px; margin-bottom:0; }
      .scene { margin:0 -26px; }
      .controls { gap:20px; justify-content:center; }
      .hint { display:none; }
      .speed,.theme { padding-left:20px; }
    }
    @media (max-width:560px) {
      .page { padding:22px 20px 20px; }
      .masthead { font-size:8px; letter-spacing:1.3px; gap:10px; }
      .edition { letter-spacing:1px; }
      .intro { margin:35px 0 17px; }
      h1 { font-size:clamp(28px,7.3vw,40px); letter-spacing:.01em; }
      .intro p { max-width:300px; font-size:12px; letter-spacing:.055em; margin-top:12px; }
      .scene { margin:0 -20px; }
      .scene svg { width:155%; max-width:none; margin-left:-27.5%; }
      .controls { flex-wrap:wrap; column-gap:18px; row-gap:14px; padding:23px 0; }
      .play { min-width:82px; font-size:13px; gap:9px; }
      .speed { font-size:12px; gap:8px; padding-left:17px; }
      input[type=range] { width:85px; }
      .theme { width:100%; justify-content:center; border-left:0; padding:0; font-size:12px; gap:12px; }
      footer { font-size:8px; letter-spacing:1.7px; padding-top:15px; }
      .closing { font-size:10px; letter-spacing:.1em; }
    }
    @media (prefers-reduced-motion:reduce) { *, *::before { transition:none !important; } }
  </style>
</head>

      <div class="controls" role="group" aria-label="骑行动画控制">
        <button class="play" id="play" type="button" aria-label="暂停骑行动画" aria-pressed="false">
          <span class="play-symbol" aria-hidden="true"><svg viewBox="0 0 20 20"><path id="play-icon" d="M6 4v12M14 4v12" fill="none" stroke="currentColor" stroke-width="3"/></svg></span><span id="play-label">暂停</span>
        </button>
        <label class="speed" for="speed"><span>骑行速度</span><input id="speed" type="range" min="0.25" max="2" value="1" step="0.25" aria-valuetext="1 倍速"><output id="speed-value" for="speed">1.0×</output></label>
        <button class="theme" id="theme" type="button" role="switch" aria-checked="false"><span>日落模式</span><span class="switch" aria-hidden="true"></span></button>
        <span class="hint"><kbd>空格</kbd> 暂停 / 继续</span>
      </div>
    </main>
    <footer><span>SVG · FRAME BY FRAME</span><span class="closing">慢一点，也会到。</span></footer>
  </div>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const svgNS = 'http://www.w3.org/2000/svg';
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reducedMotion.matches;
      let speed = 1;
      let time = 0.58;
      let previous = null;
      let frame = null;
      const parts = Object.fromEntries(['rear-spokes','front-spokes','chainring','crank','chain','rider','scarf-tail-front','scarf-tail-back','birds','ripples','sun-trail','road-marks','back-leg-path','front-leg-path','leg-highlight','back-foot','front-foot','back-pedal','front-pedal','toe-lines','pedal-highlight'].map(id => [id,$(id)]));

      // Spokes are real SVG lines. Both wheels have the same radius and angular speed.
      for (const [id,cx] of [['rear-spokes',505],['front-spokes',940]]) {
        for (let i=0;i<28;i++) {
          const angle = i * Math.PI / 14;
          const line = document.createElementNS(svgNS,'line');
          line.setAttribute('x1',cx); line.setAttribute('y1',497);
          line.setAttribute('x2',cx+Math.cos(angle)*98);
          line.setAttribute('y2',497+Math.sin(angle)*98);
          parts[id].appendChild(line);
        }
      }

      // A two-segment leg solver keeps the hip, knee and webbed foot connected.
      function leg(side, angle, bob) {
        const x = 700 + Math.cos(angle)*34;
        const y = 497 + Math.sin(angle)*34;
        const hipX = side === 'front' ? 697 : 680;
        const hipY = 361 + bob;
        const ankleX = x-8, ankleY = y-13;
        const dx = ankleX-hipX, dy = ankleY-hipY;
        const distance = Math.hypot(dx,dy);
        const upper = 88, lower = 91;
        const along = (upper*upper-lower*lower+distance*distance)/(2*distance);
        const bend = Math.sqrt(Math.max(0,upper*upper-along*along));
        const kneeX = hipX+dx*along/distance+dy*bend/distance;
        const kneeY = hipY+dy*along/distance-dx*bend/distance;
        const d = `M${hipX} ${hipY}Q${kneeX-6} ${kneeY-6} ${kneeX} ${kneeY}L${ankleX} ${ankleY}`;
        parts[`${side}-leg-path`].setAttribute('d',d);
        parts[`${side}-foot`].setAttribute('d',`M${ankleX-6} ${ankleY-5}Q${ankleX+2} ${ankleY-8} ${ankleX+7} ${ankleY+3}L${x+28} ${y-2}L${x+23} ${y+4}L${x+12} ${y+1}L${x+6} ${y+5}L${x-14} ${y+3}Q${x-20} ${y-2} ${ankleX-6} ${ankleY-5}Z`);
        parts[`${side}-pedal`].setAttribute('x',x-16);
        parts[`${side}-pedal`].setAttribute('y',y+5);
        if (side === 'front') {
          parts['leg-highlight'].setAttribute('d',d);
          parts['toe-lines'].setAttribute('d',`M${x-5} ${y-5}l18 5m-19-4 7 5`);
          parts['pedal-highlight'].setAttribute('d',`M${x-10} ${y+9}h18`);
        }
        return [x,y];
      }

      function render() {
        const phase = time * 2.6;
        const degrees = phase * 180 / Math.PI;
        const bob = Math.sin(phase*2)*1.4;
        const a = leg('front',phase,bob);
        const b = leg('back',phase+Math.PI,bob);
        parts.crank.setAttribute('d',`M${b[0]} ${b[1]}L700 497L${a[0]} ${a[1]}`);
        // 2.3 wheel turns per crank turn; positive SVG rotation rolls to the right.
        parts['rear-spokes'].setAttribute('transform',`rotate(${degrees*2.3} 505 497)`);
        parts['front-spokes'].setAttribute('transform',`rotate(${degrees*2.3} 940 497)`);
        parts.chainring.setAttribute('transform',`rotate(${degrees} 700 497)`);
        parts.chain.style.strokeDashoffset = -phase*26;
        parts.rider.setAttribute('transform',`translate(0 ${bob})`);
        const wind = Math.sin(time*3.1)*9;
        parts['scarf-tail-front'].setAttribute('d',`M741 239Q692 ${218+wind} 654 227T562 ${209-wind}L529 ${215-wind}L542 ${222-wind}L526 ${229-wind}Q576 ${220-wind} 610 ${240+wind}T734 252Z`);
        parts['scarf-tail-back'].setAttribute('d',`M739 244Q694 ${251-wind} 661 264T587 ${263+wind}L570 ${269+wind}L582 ${275+wind}Q620 ${290+wind} 662 278T741 252Z`);
        parts.birds.setAttribute('transform',`translate(${Math.sin(time*.28)*17} ${Math.sin(time*.7)*5})`);
        parts.ripples.setAttribute('transform',`translate(${Math.sin(time*.4)*22} 0)`);
        parts['sun-trail'].setAttribute('opacity',.56+Math.sin(time*1.3)*.12);
        parts['road-marks'].setAttribute('transform',`translate(${-((phase*108*2.3)%241)} 0)`);
      }

      function tick(now) {
        frame = null;
        if (!playing || document.hidden) return;
        if (previous !== null) time += Math.min((now-previous)/1000,.05)*speed;
        previous = now;
        render();
        frame = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        $('play-label').textContent = playing ? '暂停' : '继续';
        $('play').setAttribute('aria-label',playing ? '暂停骑行动画' : '继续骑行动画');
        $('play').setAttribute('aria-pressed',String(!playing));
        $('play-icon').setAttribute('d',playing ? 'M6 4v12M14 4v12' : 'M6 3L16 10L6 17Z');
        $('play-icon').setAttribute('fill',playing ? 'none' : 'currentColor');
        $('play-icon').setAttribute('stroke-width',playing ? '3' : '0');
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        previous = null;
        if (playing && !document.hidden) frame = requestAnimationFrame(tick);
      }
      $('play').addEventListener('click',() => { playing = !playing; syncPlayback(); });
      $('speed').addEventListener('input',event => {
        speed = Number(event.target.value);
        $('speed-value').textContent = `${speed.toFixed(2).replace(/0$/,'')}×`;
        event.target.setAttribute('aria-valuetext',`${speed} 倍速`);
      });
      $('theme').addEventListener('click',() => {
        const sunset = document.body.classList.toggle('sunset');
        $('theme').setAttribute('aria-checked',String(sunset));
        document.querySelector('meta[name="theme-color"]').content = sunset ? '#f3dfc9' : '#f6f0e5';
      });
      document.addEventListener('keydown',event => {
        const target = event.target;
        if (event.code !== 'Space' || event.repeat || target.closest('button,input,textarea,select,[contenteditable]')) return;
        event.preventDefault(); playing = !playing; syncPlayback();
      });
      document.addEventListener('visibilitychange',syncPlayback);
      reducedMotion.addEventListener('change',event => { if (event.matches) { playing = false; syncPlayback(); } });
      render();
      syncPlayback();
    })();
  </script>
</body>
</html>
