<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>404 — Page not found</title>
  <style>
    @font-face {
      font-family: "Basis Mono";
      src: url("/web/assets/fonts/BasisGrotesqueMonoPro-Light.woff2") format("woff2");
      font-style: normal;
      font-weight: 300;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      place-items: center;
      color: #fff;
      font-family: "Basis Mono", "Courier New", monospace;
      font-size: 14px;
      font-weight: 300;
    }

    h1 {
      margin: 0;
      font-size: 8rem;
      font-weight: 300;
      line-height: 1;
    }
  </style>
</head>
<body>
  <main aria-label="Page not found">
    <h1>404</h1>
  </main>
</body>
</html>
